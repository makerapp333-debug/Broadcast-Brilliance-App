<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Camera — Broadcast Brilliance</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #070b12; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: #38bdf8; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #1e2a3a; background: #0c1220; }
    main { flex: 1; max-width: 480px; margin: 0 auto; padding: 1.25rem; width: 100%; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    input, select { width: 100%; padding: 0.55rem 0.65rem; border-radius: 8px; border: 1px solid #2a3a4f; background: #0a0e17; color: #fff; margin-bottom: 0.75rem; }
    .btn { display: inline-block; width: 100%; padding: 0.65rem; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 0.5rem; }
    .btn-primary { background: #0d9488; color: #fff; }
    .btn-secondary { background: #1e2a3a; color: #e2e8f0; }
    video { width: 100%; border-radius: 10px; background: #000; aspect-ratio: 16/9; margin: 0.75rem 0; }
    .prefs { font-size: 12px; color: #94a3b8; background: #0f1520; border: 1px solid #1e2a3a; border-radius: 8px; padding: 0.65rem 0.75rem; margin-bottom: 0.75rem; }
    .prefs b { color: #5eead4; }
    #status { font-size: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <header><strong>Remote Camera</strong> · Broadcast Brilliance</header>
  <main>
    <p style="font-size:13px;color:#94a3b8">Field camera join. Device preferences come from the director’s share link.</p>
    <div class="prefs" id="prefs">Loading preferences…</div>
    <label>Token</label>
    <input id="token" type="text" placeholder="tok_…" />
    <label>Label (location / camera)</label>
    <input id="label" type="text" placeholder="Nairobi field" />
    <label>Camera override (optional)</label>
    <select id="cam-override">
      <option value="">Use link preference</option>
      <option value="user">Front</option>
      <option value="environment">Back</option>
    </select>
    <label>Mic override (optional)</label>
    <select id="mic-override">
      <option value="">Use link preference</option>
      <option value="default">Default mic</option>
      <option value="external">External mic preferred</option>
    </select>
    <video id="preview" autoplay playsinline muted></video>
    <button class="btn btn-secondary" type="button" onclick="startDevices()">Start camera &amp; mic</button>
    <button class="btn btn-primary" type="button" onclick="registerRemote()">Register with studio</button>
    <div id="status"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const tokenFromUrl = params.get('token') || '';
    const camPref = params.get('cam') || 'user';
    const micPref = params.get('mic') || 'external';
    if (tokenFromUrl) document.getElementById('token').value = tokenFromUrl;
    document.getElementById('prefs').innerHTML =
      'Link prefs: camera <b>' + (camPref === 'environment' ? 'Back' : 'Front') + '</b> · mic <b>' +
      (micPref === 'external' ? 'External preferred' : 'Default') + '</b>';

    let localStream = null;

    async function pickAudioConstraints(preferExternal) {
      const base = { echoCancellation: true, noiseSuppression: true };
      if (!preferExternal) return base;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter(d => d.kind === 'audioinput');
        const ext = inputs.find(d => /usb|external|headset|wireless|boom|rode|blue|yeti/i.test(d.label || ''));
        if (ext && ext.deviceId) return { ...base, deviceId: { ideal: ext.deviceId } };
      } catch (e) {}
      return base;
    }

    async function startDevices() {
      const st = document.getElementById('status');
      const camO = document.getElementById('cam-override').value;
      const micO = document.getElementById('mic-override').value;
      const facing = camO || camPref || 'user';
      const micMode = micO || micPref || 'external';
      try {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        const audio = await pickAudioConstraints(micMode === 'external');
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: audio
        });
        const v = document.getElementById('preview');
        v.srcObject = localStream;
        await v.play().catch(() => {});
        st.style.color = '#86efac';
        st.textContent = 'Devices active · cam=' + facing + ' · mic=' + micMode + ' (local only until WebRTC connected)';
      } catch (err) {
        st.style.color = '#fca5a5';
        st.textContent = 'Device error: ' + (err.message || err);
      }
    }

    function registerRemote() {
      const token = (document.getElementById('token').value || '').trim();
      const label = (document.getElementById('label').value || '').trim() || 'Remote';
      const st = document.getElementById('status');
      if (!token) { st.style.color = '#fca5a5'; st.textContent = 'Token required'; return; }
      const camO = document.getElementById('cam-override').value;
      const micO = document.getElementById('mic-override').value;
      const payload = {
        token, label, name: label, joinedAt: Date.now(), status: 'ready',
        cam: camO || camPref, mic: micO || micPref
      };
      try {
        localStorage.setItem('bb_remote_join', JSON.stringify(payload));
        const log = JSON.parse(localStorage.getItem('bb_remote_join_log') || '[]');
        log.unshift(payload);
        localStorage.setItem('bb_remote_join_log', JSON.stringify(log.slice(0, 20)));
        st.style.color = '#86efac';
        st.textContent = 'Registered “' + label + '” · token ' + token;
      } catch (e) {
        st.style.color = '#fca5a5';
        st.textContent = 'Could not register locally';
      }
    }

    // Auto-start if token present
    if (tokenFromUrl) setTimeout(() => { startDevices().catch(() => {}); }, 400);
  </script>
</body>
</html>
