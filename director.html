<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Director · Broadcast Brilliance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; background: #0a0e17; color: #e2e8f0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow-x: hidden; -webkit-tap-highlight-color: transparent;
    }
    .app {
      min-height: 100%; max-width: 560px; margin: 0 auto;
      display: flex; flex-direction: column; padding: 0 0 env(safe-area-inset-bottom);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #0c1220; border-bottom: 1px solid #1e2a3a;
      position: sticky; top: 0; z-index: 20;
    }
    header h1 { font-size: 13px; font-weight: 800; letter-spacing: 0.04em; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px;
      background: #334155; color: #cbd5e1;
    }
    .badge.live { background: #dc2626; color: #fff; }
    .badge.live i { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .monitors {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 10px 12px;
    }
    .mon {
      border-radius: 8px; overflow: hidden; background: #000;
      border: 2px solid #1e2a3a; position: relative;
      aspect-ratio: 16 / 9;
    }
    .mon.preview { border-color: #22c55e; }
    .mon.program { border-color: #ef4444; }
    .mon label {
      position: absolute; top: 4px; left: 6px; z-index: 2;
      font-size: 9px; font-weight: 800; letter-spacing: 0.06em;
      text-shadow: 0 1px 3px #000;
    }
    .mon.preview label { color: #4ade80; }
    .mon.program label { color: #f87171; }
    .mon img { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .mon .empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #475569; text-align: center; padding: 8px;
    }
    .timer-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px 8px; font-size: 12px; color: #94a3b8;
    }
    .timer-row .clock { font-family: ui-monospace, monospace; font-weight: 700; color: #fff; font-size: 16px; }
    .section { padding: 0 12px 12px; }
    .section h2 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #64748b; margin-bottom: 8px;
    }
    .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-btns.three { grid-template-columns: 1fr 1fr 1fr; }
    button.ctrl {
      border: 0; border-radius: 10px; padding: 14px 10px;
      font-size: 13px; font-weight: 800; color: #fff; cursor: pointer;
      min-height: 48px;
    }
    button.ctrl:active { transform: scale(0.97); opacity: 0.9; }
    button.ctrl:disabled { opacity: 0.4; }
    .btn-take { background: #16a34a; grid-column: span 2; font-size: 18px; padding: 18px; }
    .btn-cut { background: #334155; }
    .btn-fade { background: #1d4ed8; }
    .btn-black { background: #0f172a; border: 1px solid #334155; }
    .btn-hold { background: #b45309; }
    .btn-auto { background: #4338ca; }
    .btn-emg { background: #991b1b; grid-column: span 2; }
    .btn-next { background: #0f766e; }
    .btn-prev { background: #155e75; }
    .sources {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .src-chip {
      border: 1px solid #2a3a4f; background: #131a28; color: #cbd5e1;
      border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 700;
      cursor: pointer;
    }
    .src-chip.active { border-color: #22c55e; background: #14532d; color: #bbf7d0; }
    .src-chip.pgm { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444; }
    .status-line {
      font-size: 11px; color: #64748b; padding: 8px 14px 16px; text-align: center; line-height: 1.4;
    }
    .status-line.ok { color: #86efac; }
    .status-line.warn { color: #fcd34d; }
    footer {
      margin-top: auto; padding: 10px 14px 16px; border-top: 1px solid #1e2a3a;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    footer a { color: #38bdf8; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>DIRECTOR</h1>
      <span class="badge" id="bc-badge">OFFLINE</span>
    </header>

    <div class="monitors">
      <div class="mon preview">
        <label>PREVIEW</label>
        <img id="pvw-img" alt="" />
        <div class="empty" id="pvw-empty">No preview</div>
      </div>
      <div class="mon program">
        <label>PROGRAM</label>
        <img id="pgm-img" alt="" />
        <div class="empty" id="pgm-empty">No program</div>
      </div>
    </div>

    <div class="timer-row">
      <span id="src-label">Source: —</span>
      <span class="clock" id="timer">00:00:00</span>
    </div>

    <div class="section">
      <h2>Switcher</h2>
      <div class="grid-btns">
        <button type="button" class="ctrl btn-take" data-cmd="take">TAKE</button>
        <button type="button" class="ctrl btn-cut" data-cmd="cut">CUT</button>
        <button type="button" class="ctrl btn-fade" data-cmd="fade">FADE</button>
        <button type="button" class="ctrl btn-black" data-cmd="black">BLACK</button>
        <button type="button" class="ctrl btn-hold" data-cmd="hold">HOLD</button>
        <button type="button" class="ctrl btn-auto" data-cmd="auto">AUTO</button>
        <button type="button" class="ctrl btn-emg" data-cmd="emergency">EMERGENCY</button>
      </div>
    </div>

    <div class="section">
      <h2>Preview source (tap → PVW)</h2>
      <div class="sources" id="source-chips"></div>
    </div>

    <div class="section">
      <h2>Rundown</h2>
      <div class="grid-btns">
        <button type="button" class="ctrl btn-prev" data-cmd="rundown_prev">◀ Prev</button>
        <button type="button" class="ctrl btn-next" data-cmd="rundown_next">Next ▶</button>
      </div>
      <div id="rundown-now" style="margin-top:8px;font-size:12px;color:#94a3b8">—</div>
    </div>

    <div class="section">
      <h2>Broadcast</h2>
      <div class="grid-btns">
        <button type="button" class="ctrl" style="background:#b91c1c" data-cmd="broadcast_start">START</button>
        <button type="button" class="ctrl" style="background:#475569" data-cmd="broadcast_stop">STOP</button>
      </div>
    </div>

    <p class="status-line" id="status">Connects to Studio on this same site (keep Studio open).</p>

    <footer>
      <a href="index.html">Studio</a>
      <a href="watch.html">Watch</a>
      <a href="landing.html">Home</a>
    </footer>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const bcBadge = document.getElementById('bc-badge');
    const timerEl = document.getElementById('timer');
    const srcLabel = document.getElementById('src-label');
    const rundownNow = document.getElementById('rundown-now');
    const chips = document.getElementById('source-chips');
    let dirBc = null;
    let lastPgm = 0;

    function setStatus(msg, cls) {
      statusEl.textContent = msg;
      statusEl.className = 'status-line' + (cls ? ' ' + cls : '');
    }

    function sendCmd(cmd, payload) {
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
      const msg = { type: 'director-cmd', cmd: cmd, payload: payload || {}, at: Date.now() };
      try {
        if (dirBc) dirBc.postMessage(msg);
        localStorage.setItem('bb_director_cmd', JSON.stringify(msg));
        setStatus('Sent: ' + cmd, 'ok');
      } catch (e) {
        setStatus('Could not send command', 'warn');
      }
    }

    document.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('click', () => sendCmd(btn.getAttribute('data-cmd')));
    });

    function renderSources(list, previewId, programId) {
      if (!Array.isArray(list)) return;
      chips.innerHTML = list.map(s => {
        const cls = ['src-chip'];
        if (s.id === previewId) cls.push('active');
        if (s.id === programId) cls.push('pgm');
        return '<button type="button" class="' + cls.join(' ') + '" data-src="' + s.id + '">' +
          (s.name || s.id) + '</button>';
      }).join('');
      chips.querySelectorAll('[data-src]').forEach(b => {
        b.addEventListener('click', () => sendCmd('select_source', { id: b.getAttribute('data-src') }));
      });
    }

    function onState(m) {
      if (!m) return;
      if (m.timer) timerEl.textContent = m.timer;
      if (m.broadcastState === 'live') {
        bcBadge.className = 'badge live';
        bcBadge.innerHTML = '<i></i> LIVE';
      } else {
        bcBadge.className = 'badge';
        bcBadge.textContent = (m.broadcastState || 'OFFLINE').toUpperCase();
      }
      if (m.programLabel) srcLabel.textContent = 'PGM: ' + m.programLabel;
      if (m.rundownLabel) rundownNow.textContent = m.rundownLabel;
      if (m.sources) renderSources(m.sources, m.previewId, m.programId);
      if (m.programFrame) {
        const img = document.getElementById('pgm-img');
        const empty = document.getElementById('pgm-empty');
        img.src = m.programFrame;
        img.style.display = 'block';
        empty.style.display = 'none';
        lastPgm = Date.now();
      }
      if (m.previewFrame) {
        const img = document.getElementById('pvw-img');
        const empty = document.getElementById('pvw-empty');
        img.src = m.previewFrame;
        img.style.display = 'block';
        empty.style.display = 'none';
      }
    }

    try {
      dirBc = new BroadcastChannel('bb-director');
      dirBc.onmessage = (ev) => {
        const m = ev.data || {};
        if (m.type === 'director-state') onState(m);
        if (m.type === 'program-frame' && m.dataUrl) {
          onState({ programFrame: m.dataUrl, broadcastState: m.live ? 'live' : undefined });
        }
      };
      // Also listen watch channel for program frames
      const watchBc = new BroadcastChannel('bb-watch');
      watchBc.onmessage = (ev) => {
        const m = ev.data || {};
        if (m.type === 'program-frame' && m.dataUrl) {
          onState({ programFrame: m.dataUrl, broadcastState: m.live ? 'live' : undefined });
        }
      };
      dirBc.postMessage({ type: 'director-hello', at: Date.now() });
      setInterval(() => {
        try {
          localStorage.setItem('bb_director_viewer', JSON.stringify({ at: Date.now() }));
          dirBc.postMessage({ type: 'director-hello', at: Date.now() });
        } catch (e) {}
        if (lastPgm && Date.now() - lastPgm > 12000) {
          document.getElementById('pgm-empty').style.display = 'flex';
        }
      }, 2000);
      setStatus('Listening for Studio… keep Studio open on this origin.', 'ok');
    } catch (e) {
      setStatus('BroadcastChannel not available in this browser.', 'warn');
    }
  </script>
</body>
</html>
