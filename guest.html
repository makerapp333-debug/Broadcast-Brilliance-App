<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guest Join — Broadcast Brilliance</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #070b12; color: #e2e8f0; min-height: 100vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #1e2a3a; background: #0c1220; }
    main { max-width: 440px; margin: 0 auto; padding: 1.25rem; }
    label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    input { width: 100%; padding: 0.55rem 0.65rem; border-radius: 8px; border: 1px solid #2a3a4f; background: #0a0e17; color: #fff; margin-bottom: 0.75rem; }
    .btn { width: 100%; padding: 0.65rem; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 0.5rem; }
    .btn-primary { background: #7c3aed; color: #fff; }
    .btn-secondary { background: #1e2a3a; color: #e2e8f0; }
    video { width: 100%; border-radius: 10px; background: #000; aspect-ratio: 16/9; margin: 0.75rem 0; }
    .note { font-size: 12px; color: #94a3b8; background: #0f1520; border: 1px solid #1e2a3a; border-radius: 8px; padding: 0.65rem; margin-bottom: 0.75rem; }
    .note b { color: #c4b5fd; }
  </style>
</head>
<body>
  <header><strong>Guest join</strong> · Broadcast Brilliance</header>
  <main>
    <p class="note">Guest links prefer an <b>external microphone</b> when the browser can find one (USB / headset). Falls back to the default mic.</p>
    <label>Invite token</label>
    <input id="token" type="text" placeholder="tok_xxxxxxxx" />
    <label>Display name</label>
    <input id="display-name" type="text" placeholder="Your name" />
    <video id="preview" autoplay playsinline muted></video>
    <button class="btn btn-secondary" type="button" onclick="startDevices()">Allow camera &amp; microphone</button>
    <button class="btn btn-primary" type="button" onclick="joinLobby()">Join lobby</button>
    <div id="device-status" style="font-size:12px;margin-top:0.5rem;color:#94a3b8"></div>
    <div id="join-msg" style="font-size:12px;margin-top:0.35rem"></div>
    <div id="lobby-status" style="display:none;font-size:12px;margin-top:0.5rem;color:#86efac"></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const tokenFromUrl = params.get('token') || '';
    const micPref = params.get('mic') || 'external';
    if (tokenFromUrl) document.getElementById('token').value = tokenFromUrl;
    let localStream = null;

    async function pickAudioConstraints() {
      const base = { echoCancellation: true, noiseSuppression: true };
      if (micPref !== 'external') return base;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const inputs = devices.filter(d => d.kind === 'audioinput');
        const ext = inputs.find(d => /usb|external|headset|wireless|boom|rode|blue|yeti/i.test(d.label || ''));
        if (ext && ext.deviceId) return { ...base, deviceId: { ideal: ext.deviceId } };
      } catch (e) {}
      return base;
    }

    async function startDevices() {
      const st = document.getElementById('device-status');
      try {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        const audio = await pickAudioConstraints();
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: audio
        });
        const v = document.getElementById('preview');
        v.srcObject = localStream;
        await v.play().catch(() => {});
        st.style.color = '#86efac';
        st.textContent = 'Camera + mic active (external preferred: ' + micPref + '). Local preview only.';
      } catch (err) {
        st.style.color = '#fca5a5';
        st.textContent = 'Could not access devices: ' + (err.message || err);
      }
    }

    function joinLobby() {
      const token = (document.getElementById('token').value || '').trim();
      const name = (document.getElementById('display-name').value || '').trim() || 'Guest';
      const msg = document.getElementById('join-msg');
      const lobby = document.getElementById('lobby-status');
      if (!token) { msg.style.color = '#fca5a5'; msg.textContent = 'Token is required.'; return; }
      try {
        const payload = { token, name, joinedAt: Date.now(), status: 'lobby', mic: micPref };
        localStorage.setItem('bb_guest_join', JSON.stringify(payload));
        const list = JSON.parse(localStorage.getItem('bb_guest_join_log') || '[]');
        list.unshift(payload);
        localStorage.setItem('bb_guest_join_log', JSON.stringify(list.slice(0, 20)));
      } catch (e) {}
      msg.style.color = '#86efac';
      msg.textContent = 'Joined as ' + name + '.';
      lobby.style.display = 'block';
      lobby.textContent = 'In lobby — wait for the director to Admit you in Guests.';
    }
  </script>
</body>
</html>
